<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4年1組 週案</title><style>
:root{--pink:#f7dce3;--deep:#a94f68;--line:#777}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff8fa;color:#222;font-family:"Yu Gothic",Meiryo,sans-serif}button,input,select,textarea{font:inherit}.tools{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff8fa;border-bottom:1px solid #ecd4da}.tools button{min-height:40px;padding:8px 13px;border:1px solid #e5bac5;border-radius:8px;background:var(--pink);color:#633443;font-weight:700}.tools .pdf{background:#d88498;color:#fff}.status{width:100%;text-align:center;color:#765763;font-size:12px}.screen-wrap{padding:16px}.sheet{width:min(100%,900px);margin:auto;padding:14px;background:#fff;border:1px solid #efd8de;border-radius:12px;box-shadow:0 5px 18px #7d4a5615}h1{margin:0 0 8px;text-align:center;color:var(--deep);font-size:25px;letter-spacing:.06em}.datebox{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:9px;font-weight:700}.datebox input{padding:5px 8px;border:1px solid #aaa;border-radius:5px;background:#fff}.scroll{overflow-x:auto}table{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed;background:#fff}th,td{border:1px solid var(--line)}thead tr:first-child th{height:36px;padding:4px;background:var(--pink);color:#633443;text-align:center}thead tr:first-child th:first-child{width:64px}.period{width:64px;padding:3px;text-align:center;background:#fdf0f3;font-weight:700}.memo-row th{height:100px;padding:3px;background:#fff}.memo,.content{display:block;width:100%;margin:0;padding:5px;border:0;background:#fff;color:#222;outline:none;resize:none}.memo{height:92px}.cell{height:115px;padding:4px;background:#fff;vertical-align:top}.subject{display:block;width:100%;height:31px;padding:3px 4px;border:1px solid #aaa;border-radius:4px;background:#fff;font-weight:700}.content{height:73px;margin-top:3px;border:1px solid #bbb;border-radius:4px}.weekly-memo-box{margin-top:8px;border:1px solid var(--line);background:#fff}.weekly-memo-title{padding:5px 7px;background:#fdf0f3;color:#633443;font-weight:700;border-bottom:1px solid var(--line)}.weekly-memo{display:block;width:100%;height:90px;margin:0;padding:7px;border:0;background:#fff;color:#222;outline:none;resize:vertical}.hint{margin:8px 0 0;text-align:right;color:#765763;font-size:12px}@media(max-width:700px){.screen-wrap{padding:7px}.sheet{padding:8px}.tools button{flex:1 1 42%}}

/* 直接PDF生成専用のB4縦レイアウト */
.pdf-stage{position:fixed;left:-10000px;top:0;width:250mm;height:353mm;background:#fff;z-index:-1;overflow:hidden}
.pdf-stage .sheet{width:250mm;height:353mm;margin:0;padding:8mm 10mm;background:#fff;border:0;border-radius:0;box-shadow:none}
.pdf-stage h1{height:11mm;margin:0;text-align:center;font-size:21pt;line-height:11mm}
.pdf-stage .datebox{height:9mm;margin:0 0 2mm;font-size:10pt}
.pdf-stage .datebox input{height:7mm;padding:0 2mm;border:0;background:#fff;font-weight:700}
.pdf-stage .scroll{width:230mm;overflow:visible}
.pdf-stage table{width:230mm;min-width:0;height:auto;border:0.4mm solid var(--line);border-collapse:collapse;table-layout:fixed}
.pdf-stage th,.pdf-stage td{border:0.25mm solid var(--line)}
.pdf-stage thead tr:first-child{height:10mm}
.pdf-stage thead tr:first-child th{height:10mm;padding:1mm;font-size:10pt}
.pdf-stage thead tr:first-child th:first-child,.pdf-stage .period{width:19mm}
.pdf-stage .memo-row,.pdf-stage .memo-row th{height:31mm}
.pdf-stage .memo-row th{padding:1mm}
.pdf-stage .memo{height:28mm;padding:1mm;border:0;font-size:10pt;overflow:hidden;resize:none}
.pdf-stage tbody tr,.pdf-stage .cell{height:38mm;max-height:38mm}
.pdf-stage .cell{padding:1mm;overflow:hidden}
.pdf-stage .period{padding:1mm;font-size:10pt}
.pdf-stage .subject{height:8mm;padding:0 1mm;border:0;border-radius:0;background:#fff;font-size:17pt;appearance:none;-webkit-appearance:none}
.pdf-stage .content{height:27mm;margin-top:1mm;padding:1mm;border:0;border-radius:0;font-size:10pt;overflow:hidden;resize:none}
.pdf-stage tbody tr:last-child th,.pdf-stage tbody tr:last-child td{border-bottom:0.5mm solid #555}
.pdf-stage .weekly-memo-box{width:230mm;height:42mm;margin-top:4mm;border:0.4mm solid var(--line);background:#fff}
.pdf-stage .weekly-memo-title{height:7mm;padding:1mm 2mm;background:#fdf0f3;border-bottom:0.25mm solid var(--line);font-size:10pt;line-height:5mm}
.pdf-stage .weekly-memo{height:34mm;padding:1.5mm;border:0;font-size:10pt;overflow:hidden;resize:none}
.pdf-stage .hint{display:none}
@page{size:B4 portrait;margin:0}
@media print{
html,body{width:210mm!important;height:297mm!important;margin:0!important;padding:0!important;background:#fff!important}body{overflow:hidden!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.tools{display:none!important}.screen-wrap{width:210mm!important;height:260mm!important;margin:0!important;padding:0!important;overflow:visible!important}.sheet{width:184mm!important;height:auto!important;max-width:none!important;margin:5mm auto 0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;break-inside:avoid!important;page-break-inside:avoid!important;break-after:avoid!important;page-break-after:avoid!important}h1{height:8mm!important;margin:0!important;font-size:15pt!important;line-height:8mm!important}.datebox{height:7mm!important;margin:0 0 1.5mm!important;font-size:8.5pt!important}.datebox input{height:5.5mm!important;padding:0 1mm!important;border:0!important;background:#fff!important;font-weight:700!important}.scroll{width:184mm!important;height:auto!important;overflow:visible!important}table{width:184mm!important;height:auto!important;min-width:0!important;border-collapse:collapse!important;table-layout:fixed!important;border:0.35mm solid var(--line)!important;break-inside:avoid!important;page-break-inside:avoid!important}th,td{border:0.25mm solid var(--line)!important}thead tr:first-child{height:8mm!important}thead tr:first-child th{height:8mm!important;padding:.7mm!important;font-size:8.5pt!important}thead tr:first-child th:first-child,.period{width:16mm!important}.memo-row{height:24mm!important}.memo-row th{height:24mm!important;padding:.7mm!important}.memo{height:22mm!important;padding:1mm!important;font-size:8.5pt!important;overflow:hidden!important}tbody tr{height:28mm!important;max-height:28mm!important;break-inside:avoid!important;page-break-inside:avoid!important}.cell{height:28mm!important;max-height:28mm!important;padding:.8mm!important;overflow:hidden!important}.period{padding:.8mm!important;font-size:8.5pt!important}.subject{height:6.5mm!important;padding:0 .8mm!important;border:0!important;border-radius:0!important;background:#fff!important;font-size:9pt!important;appearance:none!important;-webkit-appearance:none!important}.content{height:18.5mm!important;margin-top:.7mm!important;padding:.8mm!important;border:0!important;border-radius:0!important;font-size:8.5pt!important;overflow:hidden!important}tbody tr:last-child th,tbody tr:last-child td{border-bottom:0.5mm solid #555!important}.weekly-memo-box{width:184mm!important;height:25mm!important;margin-top:3mm!important;border:0.35mm solid var(--line)!important;break-inside:avoid!important;page-break-inside:avoid!important}.weekly-memo-title{height:6mm!important;padding:1mm 2mm!important;border-bottom:0.25mm solid var(--line)!important;background:#fdf0f3!important;font-size:8.5pt!important;line-height:4mm!important}.weekly-memo{height:18mm!important;padding:1.5mm!important;border:0!important;font-size:8.5pt!important;overflow:hidden!important;resize:none!important}.hint{display:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head><body><div class="tools"><button id="prev">← 前の週</button><button id="next">次の週 →</button><button id="today">今週へ</button><button id="copy">前週の時間割・メモをコピー</button><button id="clear">この週を消去</button><button id="print" class="pdf">B4 PDFを保存</button><div class="status">ボタンを押すとB4縦1ページのPDFを直接保存します。</div></div><main class="screen-wrap"><section class="sheet" id="planner"><h1>4年1組　週案</h1><div class="datebox"><label for="monday">月曜日の日付</label><input id="monday" type="date"></div><div class="scroll"><table><thead><tr><th>校時</th><th id="d0">月</th><th id="d1">火</th><th id="d2">水</th><th id="d3">木</th><th id="d4">金</th></tr><tr class="memo-row"><th>メモ</th><th><textarea class="memo"></textarea></th><th><textarea class="memo"></textarea></th><th><textarea class="memo"></textarea></th><th><textarea class="memo"></textarea></th><th><textarea class="memo"></textarea></th></tr></thead><tbody id="body"></tbody></table></div><div class="weekly-memo-box"><div class="weekly-memo-title">週間メモ</div><textarea id="weeklyMemo" class="weekly-memo"></textarea></div><p class="hint">Goodnotes用PDFは「B4 PDFを保存」から直接保存できます。</p></section></main><script>
const subjects=['国語','算数','理科','社会','図工','総合','体育','書写','図書','特活','道徳','音楽','外国語','水泳','委員会','クラブ'];const colors={'国語':'#d71920','算数':'#0969da','社会':'#e87500','体育':'#e91e78','音楽':'#dc8b00','図工':'#7b2cbf','道徳':'#e889a8','総合':'#16853b','水泳':'#149fc4','理科':'#111','図書':'#111','書写':'#111','委員会':'#111','クラブ':'#111','特活':'#111','外国語':'#111'};const body=document.getElementById('body'),monday=document.getElementById('monday'),memos=[...document.querySelectorAll('.memo')],weeklyMemo=document.getElementById('weeklyMemo'),prefix='weeklyPlan_a4_';const pad=n=>String(n).padStart(2,'0'),ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=v=>{const a=v.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};function thisMonday(){const d=new Date(),x=(d.getDay()+6)%7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-x)}function makeCell(){const td=document.createElement('td');td.className='cell';const s=document.createElement('select');s.className='subject';s.innerHTML='<option value="">教科を選択</option>'+subjects.map(x=>`<option>${x}</option>`).join('');const t=document.createElement('textarea');t.className='content';td.append(s,t);return td}for(let p=1;p<=6;p++){const tr=document.createElement('tr'),th=document.createElement('th');th.className='period';th.textContent=p+'校時';tr.append(th);for(let d=0;d<5;d++)tr.append(makeCell());body.append(tr)}function paint(s){s.style.color=colors[s.value]||'#111';s.closest('.cell').style.background='#fff'}function headers(){if(!monday.value)return;const d=parse(monday.value),names=['月','火','水','木','金'];for(let i=0;i<5;i++){const x=new Date(d);x.setDate(d.getDate()+i);document.getElementById('d'+i).textContent=`${names[i]}　${x.getMonth()+1}/${x.getDate()}`}}function collect(){return{monday:monday.value,memos:memos.map(x=>x.value),weeklyMemo:weeklyMemo.value,lessons:[...document.querySelectorAll('.cell')].map(c=>({subject:c.querySelector('select').value,content:c.querySelector('textarea').value}))}}function save(){if(monday.value){localStorage.setItem(prefix+monday.value,JSON.stringify(collect()));localStorage.setItem('weeklyPlan_a4_last',monday.value)}}function blank(){memos.forEach(x=>x.value='');weeklyMemo.value='';document.querySelectorAll('.cell').forEach(c=>{const s=c.querySelector('select');s.value='';paint(s);c.querySelector('textarea').value=''})}function load(v){monday.value=v;headers();blank();const raw=localStorage.getItem(prefix+v);if(raw)try{const z=JSON.parse(raw);memos.forEach((x,i)=>x.value=(z.memos||[])[i]||'');weeklyMemo.value=z.weeklyMemo||'';document.querySelectorAll('.cell').forEach((c,i)=>{const q=(z.lessons||[])[i]||{},s=c.querySelector('select');s.value=q.subject||'';c.querySelector('textarea').value=q.content||'';paint(s)})}catch(e){console.error(e)}localStorage.setItem('weeklyPlan_a4_last',v)}function move(n){save();const d=parse(monday.value);d.setDate(d.getDate()+7*n);load(ds(d))}body.addEventListener('change',e=>{if(e.target.matches('select'))paint(e.target);save()});document.addEventListener('input',save);monday.addEventListener('change',()=>{const d=parse(monday.value),x=(d.getDay()+6)%7;d.setDate(d.getDate()-x);load(ds(d))});document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('today').onclick=()=>{save();load(ds(thisMonday()))};document.getElementById('copy').onclick=()=>{const p=parse(monday.value);p.setDate(p.getDate()-7);const raw=localStorage.getItem(prefix+ds(p));if(!raw)return alert('前週の保存データがありません');const z=JSON.parse(raw);memos.forEach((x,i)=>x.value=(z.memos||[])[i]||'');weeklyMemo.value=z.weeklyMemo||'';document.querySelectorAll('.cell').forEach((c,i)=>{const q=(z.lessons||[])[i]||{},s=c.querySelector('select');s.value=q.subject||'';c.querySelector('textarea').value=q.content||'';paint(s)});save()};document.getElementById('clear').onclick=()=>{if(confirm('この週の内容をすべて消去しますか？')){blank();save()}};async function downloadPDF(){
 const button=document.getElementById('print');
 save();
 if(typeof html2canvas==='undefined'||!window.jspdf){alert('PDF機能の読み込みに失敗しました。インターネット接続を確認して、ページを再読み込みしてください。');return}
 const originalText=button.textContent;button.disabled=true;button.textContent='PDF作成中…';
 let stage;
 try{
  stage=document.createElement('div');stage.className='pdf-stage';
  const clone=document.getElementById('planner').cloneNode(true);
  clone.removeAttribute('id');
  const originalFields=document.getElementById('planner').querySelectorAll('input,textarea,select');
  const cloneFields=clone.querySelectorAll('input,textarea,select');
  cloneFields.forEach((field,i)=>{const source=originalFields[i];if(!source)return;field.value=source.value;if(field.tagName==='TEXTAREA')field.textContent=source.value;if(field.tagName==='SELECT'){field.querySelectorAll('option').forEach(o=>o.selected=o.value===source.value);field.style.color=colors[source.value]||'#111'}});
  stage.appendChild(clone);document.body.appendChild(stage);
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const canvas=await html2canvas(clone,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,width:clone.scrollWidth,height:clone.scrollHeight,windowWidth:clone.scrollWidth,windowHeight:clone.scrollHeight});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[250,353],compress:true});
  pdf.addImage(canvas.toDataURL('image/jpeg',0.96),'JPEG',0,0,250,353,undefined,'FAST');
  pdf.save(`4年1組_週案_${monday.value||'未設定'}.pdf`);
 }catch(error){console.error(error);alert('PDFを作成できませんでした。ページを再読み込みして、もう一度お試しください。')}
 finally{if(stage)stage.remove();button.disabled=false;button.textContent=originalText}
}
document.getElementById('print').onclick=downloadPDF;load(localStorage.getItem('weeklyPlan_a4_last')||ds(thisMonday()));
</script></body></html>
